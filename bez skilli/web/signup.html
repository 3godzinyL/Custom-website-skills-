<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create your account — Kedgely</title>
  <meta name="description" content="Create a Kedgely account and start planning realistic days." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://kedgely.app/signup" />
  <meta name="theme-color" content="#06070d" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <script type="module" src="/assets/js/auth.js"></script>
</head>
<body class="auth" data-page="signup">
  <header class="auth-top">
    <a class="brand" href="/" aria-label="Kedgely home"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg-k" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7dff"/><stop offset="1" stop-color="#ff7aa4"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="#141834"/><rect x=".5" y=".5" width="31" height="31" rx="8.5" fill="none" stroke="rgba(160,170,255,.22)"/><path d="M8 22.5c4.5 0 5-11 10.5-11H24" fill="none" stroke="url(#lg-k)" stroke-width="2.6" stroke-linecap="round"/><path d="m21 8 3.4 3.5L21 15" fill="none" stroke="url(#lg-k)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="22.5" r="2.4" fill="#ff7aa4"/></svg><span>Kedgely</span></a>
    <a class="btn btn-ghost" href="/login">Log in</a>
  </header>
  <main class="auth-main" id="main">
    <div class="auth-card is-wide">
      <h1>Create your account</h1>
      <p class="sub">Kedgely is in private beta. Have an invite code? Add it below to get access right away — otherwise your account waits for an invitation.</p>
      <form data-form="signup" novalidate>
        <div class="field"><label class="label" for="name">Your name</label><input class="input" id="name" name="name" autocomplete="name" required maxlength="80" autofocus /></div>
        <div class="field"><label class="label" for="email">Work e-mail</label><input class="input" id="email" name="email" type="email" autocomplete="email" required maxlength="254" /></div>
        <div class="field"><label class="label" for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" aria-describedby="pw-hint" /><div class="pw-meter" data-pw-meter aria-hidden="true"><i></i><i></i><i></i><i></i></div><span class="hint" id="pw-hint">At least 10 characters. A short sentence works well.</span></div>
        <div class="field"><label class="label" for="inviteCode">Invite code <span class="muted">(optional)</span></label><input class="input mono" id="inviteCode" name="inviteCode" autocomplete="off" spellcheck="false" placeholder="KDG-XXXX-XXXX-XXXX-XXXX" maxlength="40" /></div>
        <label class="check"><input type="checkbox" name="acceptTerms" required /> <span>I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a> and have read the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>
        <label class="check"><input type="checkbox" name="marketing" /> <span>Send me occasional product updates (optional).</span></label>
        <button class="btn btn-primary btn-lg" type="submit">Create account</button>
      </form>
      <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>
  <footer class="auth-foot">© 2026 Kedgely · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
</body>
</html>
