<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Kedgely</title>
  <meta name="description" content="Log in to Kedgely, the adaptive AI day planner." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://kedgely.app/login" />
  <meta name="theme-color" content="#06070d" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <script type="module" src="/assets/js/auth.js"></script>
</head>
<body class="auth" data-page="login">
  <header class="auth-top">
    <a class="brand" href="/" aria-label="Kedgely home"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg-k" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7dff"/><stop offset="1" stop-color="#ff7aa4"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="#141834"/><rect x=".5" y=".5" width="31" height="31" rx="8.5" fill="none" stroke="rgba(160,170,255,.22)"/><path d="M8 22.5c4.5 0 5-11 10.5-11H24" fill="none" stroke="url(#lg-k)" stroke-width="2.6" stroke-linecap="round"/><path d="m21 8 3.4 3.5L21 15" fill="none" stroke="url(#lg-k)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="22.5" r="2.4" fill="#ff7aa4"/></svg><span>Kedgely</span></a>
    <a class="btn btn-ghost" href="/signup">Create account</a>
  </header>
  <main class="auth-main" id="main">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to see today's plan.</p>
      <form data-form="login" novalidate>
        <div class="field"><label class="label" for="email">E-mail</label><input class="input" id="email" name="email" type="email" autocomplete="email" required maxlength="254" autofocus /></div>
        <div class="field"><div class="label-row"><label class="label" for="password">Password</label><a href="/forgot-password">Forgot password?</a></div><input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" /></div>
        <button class="btn btn-primary btn-lg" type="submit">Log in</button>
      </form>
      <p class="auth-alt">New to Kedgely? <a href="/signup">Create an account</a></p>
    </div>
  </main>
  <footer class="auth-foot">© 2026 Kedgely · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
</body>
</html>
